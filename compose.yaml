services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: book-rental-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: book_rental_db
      POSTGRES_USER: book_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    command: ["postgres", "-c", "timezone=Asia/Seoul"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_user -d book_rental_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: